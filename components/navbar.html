<style>
.navbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: rgba(253, 252, 251, 0.86);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(22, 18, 28, 0.09);
    box-shadow: none;
    z-index: 1000;
    transition: background 0.35s ease, box-shadow 0.35s ease;
}

.navbar-scrolled {
    background: rgba(253, 252, 251, 0.96);
    box-shadow: 0 10px 30px rgba(20, 16, 27, 0.06);
}

.navbar-content {
    max-width: 1400px;
    margin: 0 auto;
    padding: 1rem 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.navbar-logo {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.logo-circle {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 1px rgba(201, 168, 106, 0.7), 0 6px 18px rgba(20, 16, 27, 0.10);
    transition: transform 0.35s ease;
}

.logo-circle:hover {
    transform: scale(1.04);
}

.logo-circle img {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    object-fit: cover;
}

.logo-text {
    display: flex;
    flex-direction: column;
}

.logo-text .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: #14101B;
    line-height: 1;
    margin-bottom: 0.3rem;
}

.logo-text .brand-tagline {
    font-size: 0.66rem;
    color: #A8853F;
    text-transform: uppercase;
    letter-spacing: 0.34em;
    font-weight: 500;
}

.navbar-menu {
    display: flex;
    align-items: center;
    gap: 2.5rem;
    list-style: none;
}

.navbar-menu a {
    color: #2B2433;
    font-weight: 400;
    font-size: 0.74rem;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    position: relative;
    transition: color 0.3s ease;
}

.navbar-menu a::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 0;
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, #C9A86A, #A8853F);
    transition: width 0.3s ease;
}

.navbar-menu a:hover {
    color: #A8853F;
}

.navbar-menu a:hover::after {
    width: 100%;
}

.navbar-cta {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.navbar-phone {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.7rem 1.4rem;
    background: transparent;
    border: 1px solid rgba(22, 18, 28, 0.12);
    border-radius: 999px;
    color: #2B2433;
    font-weight: 500;
    font-size: 0.8rem;
    letter-spacing: 0.04em;
    transition: all 0.3s ease;
}

.navbar-phone:hover {
    border-color: #C9A86A;
    color: #A8853F;
    transform: translateY(-2px);
}

.navbar-whatsapp {
    padding: 0.7rem 1.5rem;
    background: #1EBE5D;
    color: white;
    border-radius: 999px;
    font-weight: 500;
    font-size: 0.74rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(30, 190, 93, 0.26);
}

.navbar-whatsapp:hover {
    background: #169549;
    transform: translateY(-2px);
    box-shadow: 0 12px 26px rgba(22, 149, 73, 0.32);
}

.hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 8px;
}

.hamburger span {
    width: 25px;
    height: 3px;
    background: #F25C93;
    border-radius: 3px;
    transition: all 0.3s ease;
}

.hamburger.active span:nth-child(1) {
    transform: rotate(45deg) translate(8px, 8px);
}

.hamburger.active span:nth-child(2) {
    opacity: 0;
}

.hamburger.active span:nth-child(3) {
    transform: rotate(-45deg) translate(7px, -7px);
}

@media (max-width: 1024px) {
    .navbar-menu {
        gap: 1.5rem;
    }
    
    .navbar-cta {
        gap: 0.75rem;
    }
    
    .navbar-phone,
    .navbar-whatsapp {
        padding: 0.65rem 1.25rem;
        font-size: 0.9rem;
    }
}

@media (max-width: 768px) {
    .navbar-menu {
        position: fixed;
        top: 80px;
        left: 0;
        right: 0;
        background: white;
        flex-direction: column;
        padding: 2rem;
        gap: 1.5rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        transform: translateY(-100%);
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
    }
    
    .navbar-menu.active {
        transform: translateY(0);
        opacity: 1;
        visibility: visible;
    }
    
    /* Ocultar los botones CTA en móvil */
    .navbar-cta {
        display: none !important;
    }
    
    .hamburger {
        display: flex;
    }
    
    .logo-text .brand-name {
        font-size: 1.25rem;
    }
    
    .logo-circle {
        width: 50px;
        height: 50px;
    }
    
    .logo-circle img {
        width: 44px;
        height: 44px;
    }
}
</style>
