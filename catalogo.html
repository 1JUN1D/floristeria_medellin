    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo completo de Floristeria Toda Ocasion en Medellín. Descubre nuestra colección de arreglos florales, ramos, bouquets y regalos especiales con entrega a domicilio.">
    <meta name="keywords" content="catálogo flores Medellín, ramos, bouquets, arreglos florales, Floristeria Toda Ocasion">
    <title>Catálogo de Flores - Floristeria Toda Ocasion Medellín | Ramos y Arreglos Florales</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/catalog.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo.webp">
</head>
<body>
    <!-- Navbar -->
    <div id="navbar-container"></div>

    <!-- Hero Section -->
    <section class="catalog-hero">
        <div class="container">
            <h1>Nuestro Catálogo</h1>
            <p>Explora nuestra colección completa de arreglos florales únicos diseñados con amor</p>
        </div>
    </section>

    <!-- Search Section -->
    <section class="catalog-search">
        <div class="container">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="Buscar por nombre o código (ej: 001, Rosas Rojas, Cumpleaños...)" oninput="searchProducts()">
                <button class="search-clear" onclick="clearSearch()" id="searchClear" style="display:none;">×</button>
            </div>
        </div>
    </section>

    <!-- Filters Section -->
    <section class="catalog-filters">
        <div class="container">
            <div class="filters-container">
                <span class="filter-label">Filtrar por:</span>
                <button class="filter-btn active" onclick="filterProducts('all')">Todos</button>
                <button class="filter-btn" onclick="filterProducts('Rosas Rojas')">Rosas Rojas</button>
                <button class="filter-btn" onclick="filterProducts('Rosas Rosadas')">Rosas Rosadas</button>
                <button class="filter-btn" onclick="filterProducts('Rosas Blancas')">Rosas Blancas</button>
                <button class="filter-btn" onclick="filterProducts('Girasoles')">Girasoles</button>
                <button class="filter-btn" onclick="filterProducts('Rosas y Girasoles')">Rosas y Girasoles</button>
                <button class="filter-btn" onclick="filterProducts('Combinación de Rosas')">Combinación</button>
                <button class="filter-btn" onclick="filterProducts('Anchetas')">Anchetas</button>
                <button class="filter-btn" onclick="filterProducts('Desayunos Sorpresa')">Desayunos</button>
                <button class="filter-btn" onclick="filterProducts('Rosas con Chocolates')">Con Chocolates</button>
                <button class="filter-btn" onclick="filterProducts('Caja')">Cajas</button>
                <button class="filter-btn" onclick="filterProducts('Grados')">Grados</button>
                <button class="filter-btn" onclick="filterProducts('Bebés')">Bebés</button>
                <button class="filter-btn" onclick="filterProducts('Fúnebres')">Fúnebres</button>
            </div>
        </div>
    </section>

    <!-- Products Grid -->
    <section class="catalog-section">
        <div class="container">
            <div class="results-counter" id="resultsCounter"></div>
            <div class="products-grid" id="productsGrid">
                <!-- Los productos se cargarán con JavaScript -->
            </div>
            <div class="empty-state" id="emptyState">
                <h3>No se encontraron productos</h3>
                <p>Intenta con otro filtro</p>
            </div>
